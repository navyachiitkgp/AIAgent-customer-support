name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: "check voiceiq api app.py tests scripts --ignore E501"
      - name: Unit tests
        run: pytest -q
      - name: Offline eval smoke
        run: python scripts/run_eval.py --offline
      - name: Seed DB smoke
        run: python scripts/seed_db.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t voiceiq:ci .
