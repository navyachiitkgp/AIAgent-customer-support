services:
  voiceiq:
    build: .
    ports:
      - "8501:8501"
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./sample_data:/app/sample_data
    command: >
      bash -c "python scripts/seed_db.py &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000 &
      streamlit run app.py --server.address=0.0.0.0 --server.port=8501"
